# ═══════════════════════════════════════════════════════════════
#  Sunrise Dental Clinic — CI/CD Pipeline
#  Triggers: push/PR to main branch
#  Actions:  Build → Test → Coverage Report → Artifact Upload
# ═══════════════════════════════════════════════════════════════

name: Sunrise Dental Clinic CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ───────────────────────────────────────────────
  #  BUILD & TEST JOB
  # ───────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Cache Maven dependencies
      - name: 📦 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Build the project (compile only, skip tests)
      - name: 🔨 Build Project
        run: mvn clean compile -B

      # Step 5: Run unit tests
      - name: 🧪 Run Unit Tests
        run: mvn test -B

      # Step 6: Generate JaCoCo coverage report
      - name: 📊 Generate Code Coverage Report
        run: mvn jacoco:report -B

      # Step 7: Upload test results
      - name: 📋 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30

      # Step 8: Upload coverage report
      - name: 📈 Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 30

      # Step 9: Package the application (WAR)
      - name: 📦 Package Application
        run: mvn package -B -DskipTests

      # Step 10: Upload build artifact
      - name: 🚀 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-${{ github.sha }}
          path: target/*.war
          retention-days: 30

  # ───────────────────────────────────────────────
  #  CODE QUALITY JOB (runs in parallel)
  # ───────────────────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔍 Check Code Style
        run: mvn checkstyle:check -B || true

      - name: 📊 Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

      - name: ✅ Build Status Summary
        run: |
          echo "═══════════════════════════════════════════"
          echo "  ✅ Build:     PASSED"
          echo "  ✅ Tests:     PASSED"
          echo "  ✅ Coverage:  Report Generated"
          echo "  ✅ Package:   WAR Artifact Created"
          echo "═══════════════════════════════════════════"
