# ═══════════════════════════════════════════════════════════════
#  Sunrise Dental Clinic — Application Configuration
#  Profile: Default (Development)
# ═══════════════════════════════════════════════════════════════

# ── Application Info ──
spring.application.name=sunrise-dental-clinic
server.port=8080

# ── Database Configuration (H2 In-Memory for easy testing) ──
spring.datasource.url=jdbc:h2:mem:sunrisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.h2.console.enabled=true

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── Thymeleaf Configuration ──
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Session Management ──
server.servlet.session.timeout=30m

# ── Logging ──
logging.level.root=INFO
logging.level.com.sunrisedental=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/sunrise-dental.log

# ── JSP Configuration ──
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
