# ═══════════════════════════════════════════════════════════════
#  Sunrise Dental Clinic — Application Configuration
#  Profile: Default (Development)
# ═══════════════════════════════════════════════════════════════

# ── Application Info ──
spring.application.name=sunrise-dental-clinic
server.port=8080

# ── Database Configuration (MySQL) ──
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_dental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=dental_admin
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Thymeleaf Configuration ──
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Session Management ──
server.servlet.session.timeout=30m

# ── Logging ──
logging.level.root=INFO
logging.level.com.sunrisedental=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/sunrise-dental.log
